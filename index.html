<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ironi | Urban Renewal AI</title>
    <link rel="stylesheet" href="index.css">
    <!-- Google Fonts for a premium look -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="chat-container">
        <!-- Header: Stays fixed at the top -->
        <header class="chat-header">
            <div class="logo-circle">🏙️</div>
            <div class="header-text">
                <h1>Ironi AI</h1>
                <p>Urban Renewal Partner</p>
            </div>
        </header>

        <!-- 💬 Message Window: Where the bubbles will appear -->
        <section id="chat-window" class="chat-window">
            <!-- Messages will be injected here by index.js -->
            <div class="message assistant-message">
                Hello! I am your Ironi Assistant. How can I help you with your TAMA 38 or Pinui Binui project today?
            </div>
        </section>

        <!-- ⌨️ Input Bar: Fixed at the bottom -->
        <footer class="input-area">
            <form id="chat-form" class="chat-form">
                <textarea 
                    id="user-input" 
                    placeholder="Ask about your project..." 
                    rows="1"
                ></textarea>
                <button type="submit" id="send-btn" title="Send message">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22 2L11 13M22 2L15 22L11 13M11 13L2 9L22 2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </form>
        </footer>
    </main>

    <script type="module" src="index.js"></script>
</body>
</html>
